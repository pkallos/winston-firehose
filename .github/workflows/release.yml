name: Release

on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  actions: write
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm release
      - name: Approve the version PR's pending checks
        if: steps.changesets.outputs.has-changesets == 'true'
        run: |
          for _ in $(seq 1 12); do
            run_id=$(gh run list --workflow build.yml --branch changeset-release/master --event pull_request --json databaseId,conclusion --jq '[.[] | select(.conclusion == "action_required")][0].databaseId // empty')
            if [ -n "$run_id" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve"
              exit 0
            fi
            sleep 5
          done
        env:
          GH_TOKEN: ${{ github.token }}
